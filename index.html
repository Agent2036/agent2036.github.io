<h1>rclone-vault</h1>
<p>rclone-vault ist ein privates Werkzeug für den Eigengebrauch.</p>
<p>Es synchronisiert Dateien zwischen dem eigenen Google Drive des Betreibers und dessen eigenem Server. Dafür nutzt es das Open-Source-Programm <a href="https://rclone.org">rclone</a>.</p>
<p>Die App ist nicht für andere Nutzer bestimmt.</p>
